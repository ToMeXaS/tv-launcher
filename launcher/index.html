<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-weather">
  <div id="bgv"><video muted playsinline loop></video><video muted playsinline loop></video></div>
  <div id="ui">
    <div class="shade"></div>
    <header><div class="brand">&#10035; Home</div><div class="hdr-right"><div id="gear"></div><div id="clock"></div></div></header>
    <section class="hero">
      <div id="date"></div>
      <h1 id="greeting"></h1>
      <p id="sentence" class="wx"></p>
      <p id="sun" class="wx"></p>
    </section>
    <section id="weather" class="card wx">
      <div class="now">
        <span id="w-icon"></span><span id="w-temp"></span>
        <div class="cond"><div id="w-label"></div><div id="w-hilo"></div></div>
      </div>
      <div id="w-details"></div>
      <div id="w-hours"></div>
      <div class="hint">OK &middot; 7-day forecast</div>
    </section>
    <section id="tiles"></section>
    <section id="week">
      <h2>Next 7 days &middot; <span id="week-place"></span></h2>
      <div id="week-body">
        <div class="today-band"></div>
        <div id="week-days" class="week-row"></div>
        <svg id="week-chart" width="1680" height="300" viewBox="0 0 1680 300"></svg>
        <div id="week-rain" class="week-row"></div>
        <div id="week-wind" class="week-row"></div>
      </div>
      <div class="hint">Back to close</div>
    </section>
    <section id="settings">
      <h2>Settings</h2>
      <div id="s-nav"></div>
      <div id="s-head"></div>
      <div id="s-panel"></div>
      <div id="s-hint" class="hint"></div>
    </section>
    <div id="ambient">
      <div id="a-clock"></div>
      <div id="a-date"></div>
      <div class="wx"><span id="a-icon"></span><span id="a-temp"></span></div>
    </div>
    <div id="toast"></div>
  </div>
  <script src="js/logic.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/tv.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
