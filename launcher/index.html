<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-weather">
  <div id="ui">
    <div class="shade"></div>
    <header><div class="brand">&#10035; Home</div><div id="clock"></div></header>
    <section class="hero">
      <div id="date"></div>
      <h1 id="greeting"></h1>
      <p id="sentence" class="wx"></p>
      <p id="sun" class="wx"></p>
    </section>
    <section id="weather" class="card wx">
      <div class="now">
        <span id="w-icon"></span><span id="w-temp"></span>
        <div class="cond"><div id="w-label"></div><div id="w-hilo"></div></div>
      </div>
      <div id="w-details"></div>
      <div id="w-hours"></div>
      <div class="hint">OK &middot; 7-day forecast</div>
    </section>
    <section id="tiles"></section>
    <section id="week">
      <h2>Next 7 days &middot; &Scaron;iauliai</h2>
      <div id="week-days"></div>
      <div class="hint">Back to close</div>
    </section>
    <div id="toast"></div>
  </div>
  <script src="js/logic.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/tv.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
